name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      # Offline: uses the deterministic fake model, so no API key or spend in CI.
      # The eval gate is tests/test_eval_suite.py. The eval CLI is for live runs (it exits 1 with the fake model).
      - run: uv run pytest -q
