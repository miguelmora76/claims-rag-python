name: deploy-smoke

on:
  pull_request:
    paths: [Dockerfile, deploy/**, .github/workflows/deploy.yml]
  push:
    branches: [main]
    paths: [Dockerfile, deploy/**, .github/workflows/deploy.yml]

permissions:
  contents: read

jobs:
  smoke-deploy:
    uses: miguelmora76/platform-workflows/.github/workflows/build-deploy.yml@main
    with:
      service: claims-rag-python
      values-file: deploy/values.yaml
      smoke-port: '8000'
      smoke-path: /api/ask
      smoke-body: '{"question":"How many days do I have to file a first-level appeal?"}'
      smoke-expect: 'appeals#0'
